# The whole configuration of the docs image. It replaces the one of the base image, which is why every path that nginx writes to is
# set here. The container runs as an unprivileged user with a read-only root file system and one tmpfs on /tmp, so the process id file
# and every temporary path sit in /tmp, and the logs go to the two links of the base image that point at the standard streams.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /var/log/nginx/access.log;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # The site has only GET and HEAD, so nothing needs a body. The small limits keep a slow or large request cheap.
  client_max_body_size 1k;
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 30s;
  keepalive_timeout 30s;
  sendfile on;

  # The build writes index.html.gz next to the page, so the page is never compressed on the fly.
  gzip_static on;
  gzip_vary on;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The check of the container and of Gatus. It has no body and no log line, so a check every 10 seconds adds no noise.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200;
    }

    # The raw contract, for tools that read the spec. It is plain text so a browser shows it and does not download it.
    # An empty types block drops the mime types, so the file never gets the type of a script or a download.
    location = /openapi.yaml {
      limit_except GET HEAD {
        deny all;
      }
      types { }
      default_type "text/plain; charset=utf-8";
      include /etc/nginx/headers.conf;
      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
      add_header Cache-Control "no-cache" always;
    }

    # Browsers ask for this on every page. The page has no icon, so the answer is empty and is not logged.
    location = /favicon.ico {
      access_log off;
      return 204;
    }

    # The page. An add_header inside a location replaces the ones of the levels above, so each location includes the headers itself.
    # The Content-Security-Policy is made by the build, because it holds the hashes of the scripts of this page.
    location = / {
      limit_except GET HEAD {
        deny all;
      }
      try_files /index.html =404;
      include /etc/nginx/headers.conf;
      include /etc/nginx/csp.conf;
      add_header Cache-Control "no-cache" always;
    }

    # No other path exists, so every other request is a 404.
    location / {
      include /etc/nginx/headers.conf;
      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
      return 404;
    }
  }
}
