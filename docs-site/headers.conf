# The security headers that every answer of the docs site carries, included by each location of nginx.conf. The Content-Security-Policy
# is not here, because each location has its own. There is no Strict-Transport-Security header, because the proxy in front of this
# container ends the TLS and sets it, and two copies of it would be sent otherwise.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
