name: Bug report
description: Something in the backend is broken
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Send the request '...'
        2. Read the response '...'
        3. See the error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit sha
  - type: textarea
    id: extra
    attributes:
      label: Logs
      description: Remove tokens, passwords and personal data before you paste a log.
