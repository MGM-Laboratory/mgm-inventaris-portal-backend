name: Config lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A run is never cancelled, because GitHub keeps a cancelled run of a required check as unmet and the pull request stays blocked
concurrency:
  group: config-${{ github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull images through the Google mirror
        uses: ./.github/actions/pull-images
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

      # The image is the actionlint stage of .github/tools/Dockerfile, which the update bot keeps current
      - name: Lint workflows
        run: |
          image="$(bash ./.github/actions/pull-images/pull.sh "$(bash ./.github/tools/image.sh actionlint)")"
          docker run --rm -v "$PWD:/repo" -w /repo "$image" -color

  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows
        # the token lets the audits that ask GitHub about the actions in use run, such as the ones for known vulnerable
        # versions and for commits that are not on the branch they claim, which are skipped without it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e GH_TOKEN -v "$PWD:/repo" -w /repo "$(bash ./.github/tools/image.sh zizmor)" \
            --no-progress --format github .

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull images through the Google mirror
        uses: ./.github/actions/pull-images
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

      # The image is the hadolint stage of .github/tools/Dockerfile, which the update bot keeps current. It reads one Dockerfile from
      # the standard input, so it runs once for the API image and once for the docs image.
      - name: Lint the Dockerfiles
        run: |
          image="$(bash ./.github/actions/pull-images/pull.sh "$(bash ./.github/tools/image.sh hadolint)")"
          docker run --rm -i "$image" < Dockerfile
          docker run --rm -i "$image" < docs-site/Dockerfile

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull images through the Google mirror
        uses: ./.github/actions/pull-images
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

      # The files with the .sh ending are bash, and the settings are in .shellcheckrc
      - name: ShellCheck
        run: |
          image="$(bash ./.github/actions/pull-images/pull.sh "$(bash ./.github/tools/image.sh shellcheck)")"
          mapfile -d '' files < <(git ls-files -z '*.sh')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "The repository has no shell file yet."
            exit 0
          fi
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt "$image" "${files[@]}"

  dotenv:
    name: Dotenv lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull images through the Google mirror
        uses: ./.github/actions/pull-images
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_PULL_TOKEN }}

      # The example files are grouped by topic and not sorted, so the check for the order of the keys is off
      - name: Lint the example env files
        run: |
          docker run --rm -v "$PWD:/app:ro" -w /app "$(bash ./.github/actions/pull-images/pull.sh "$(bash ./.github/tools/image.sh dotenv-linter)")" \
            check --skip-updates --plain --ignore-checks UnorderedKey .env.example deploy/.env.example deploy/docs/.env.example

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # docker compose config reads the file and builds nothing and starts nothing. The copy of the example file lets compose read the
      # settings that have a default. The ports and the tags have none, so the first run must fail and the second run gets them
      # from the shell, which is the point of the check.
      - name: Check the compose file
        run: |
          cp deploy/.env.example deploy/.env
          if docker compose -f deploy/compose.production.example.yml config --quiet 2> /dev/null; then
            echo "The compose file starts without the ports and the tags, so it can clash with another app" >&2
            exit 1
          fi
          API_IMAGE_TAG=0.0.0 WEB_IMAGE_TAG=0.0.0 API_PORT_1=4001 API_PORT_2=4002 WEB_PORT_1=3001 WEB_PORT_2=3002 \
            docker compose -f deploy/compose.production.example.yml config --quiet

      # The same two checks for the docs site example. Its port and tag have no default either.
      - name: Check the docs compose file
        run: |
          cp deploy/docs/.env.example deploy/docs/.env
          if docker compose -f deploy/docs/compose.example.yml config --quiet 2> /dev/null; then
            echo "The docs compose file starts without the port and the tag, so it can clash with another app" >&2
            exit 1
          fi
          DOCS_IMAGE_TAG=0.0.0 DOCS_PORT=4003 docker compose -f deploy/docs/compose.example.yml config --quiet

  names:
    name: File names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ls-lint is a Node tool and this repository has no .nvmrc, so the job installs Node 24 on its own
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # ls-lint reads the names of the files and never opens one, the rules are in .ls-lint.yml
      - name: Check the names of the files
        env:
          # renovate: datasource=npm depName=@ls-lint/ls-lint
          version: 2.3.2
        run: npx --yes "@ls-lint/ls-lint@${version}"

  renovate:
    name: Renovate config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The renovate package accepts only Node 24 (its engines field is ^24.11.0), so this job pins Node 24 on its own
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # A broken renovate.json does not fail anything by itself, the bot just stops opening dependency pull requests. The strict
      # mode also fails on an option that was renamed or removed, which the bot would only migrate with a warning
      - name: Validate renovate.json
        env:
          # renovate: datasource=npm depName=renovate
          version: 44.181.7
        run: npx --yes --package "renovate@${version}" renovate-config-validator --strict

  # The spec is the contract of the API, so a spec that does not lint is found here. The rules are in redocly.yaml
  openapi:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Redocly CLI is a Node tool and this repository has no .nvmrc, so the job installs Node 24 on its own
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # The CLI is the one that docs-site/package.json pins for the docs page, so the spec is linted and built with the same version.
      # The install runs no script of any package.
      - name: Lint openapi.yaml
        working-directory: docs-site
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install redocly lint ../openapi.yaml --config ../redocly.yaml

  # A spec can lint and still fail to build, and the docs site is built from it. This runs the same build as the docs image, so a
  # spec that the viewer cannot render is found before the merge. finish-page.mjs fails on a page that needs another host.
  docs:
    name: OpenAPI docs build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Build the docs page
        working-directory: docs-site
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      # The build writes the page, its gzip copy and the Content-Security-Policy. All three must exist and hold data.
      - name: Check the files of the page
        working-directory: docs-site/dist
        run: |
          for file in index.html index.html.gz csp.txt; do
            test -s "$file" || { echo "$file is missing or empty" >&2; exit 1; }
          done
          grep -q 'script-src' csp.txt
          ls -l index.html index.html.gz csp.txt

  # The one check that the ruleset requires, so a job can be added or renamed here without a change of the ruleset
  gate:
    name: Config gate
    if: always()
    needs: [actionlint, zizmor, hadolint, shellcheck, dotenv, compose, names, renovate, openapi, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); if (Object.values(jobs).some(j => j.result !== "success")) process.exit(1)'
