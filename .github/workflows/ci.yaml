name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A run is never cancelled, because GitHub keeps a cancelled run of a required check as unmet and the pull request stays blocked
concurrency:
  group: ci-${{ github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Go build and vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  lint:
    name: Go lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.15.0

  test:
    name: Go test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # The database tests make a database of their own on this server and drop it again, so tests of different packages never share
    # rows. The image comes from the mirror of Google, because Docker Hub limits the pulls of a runner.
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # the password belongs to the throwaway server of this job and to nothing else
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test with race detector
        run: go test ./... -race -count=1 -shuffle=on -timeout 15m -covermode=atomic -coverpkg=./internal/... -coverprofile=coverage.out

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            total="$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')"
            echo "Total statement coverage is $total" >> "$GITHUB_STEP_SUMMARY"
          fi

      # A fork has no token, so its upload is skipped. A run that is not on main lets the step fail without failing the build, so a
      # Codecov outage does not block a pull request, and a run on main fails on an upload error.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && hashFiles('coverage.out') != '' && github.event.pull_request.head.repo.fork != true }}
        continue-on-error: ${{ github.ref != 'refs/heads/main' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: true

      - name: Keep the coverage file
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  # The one check of this workflow that the ruleset requires, so a job can be added or renamed here without a change of the ruleset
  gate:
    name: CI gate
    if: always()
    needs: [build, lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); if (Object.values(jobs).some(j => j.result !== "success")) process.exit(1)'
