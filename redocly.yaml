# The built-in ruleset recommended-strict is recommended with every warning raised to an error. Redocly CLI exits with 1 only on an
# error, so a warning in the recommended ruleset would pass CI, and a new rule of a later CLI version is covered as well.
extends:
  - recommended-strict

# The CLI sends no usage data, and the page that build-docs writes sends none to the vendor either. The page of the docs site has to
# make no request to another host, see docs-site/finish-page.mjs.
telemetry: off
