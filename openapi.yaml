                  dipinjam: 3
                  terlambat: 1
                units:
                  available: 20
                  borrowed: 4
                  maintenance: 1
                  lost: 0
                  retired: 0
                byStatus:
                  diajukan: 2
                  disetujui: 1
                  siapDiambil: 0
                  dipinjam: 3
                  terlambat: 1
                  dikembalikan: 12
                  dibatalkan: 2
                  ditolak: 1
                byCategory:
                  - categoryId: 00000000-0000-4000-8000-000000000001
