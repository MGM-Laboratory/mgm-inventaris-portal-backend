openapi: 3.1.0
info:
  title: LabMGM inventory portal API
  version: "1"
  summary: The API of the loan portal for the inventory of the lab
  description: |
    The API serves the web app of the LabMGM inventory portal. A borrower asks for items, an admin approves the request, hands the items over and takes them back.

    This file is the full contract. A route that changes in the service changes here in the same pull request. The pages `docs/api.md`, `docs/data-model.md` and `docs/errors.md` of the repository explain the rules behind it.

    Every path starts with `/api` and lives on the same hostname as the web app, so there is no CORS. The two health routes are the only exception. They are served on an internal port that the proxy does not route.

    Bodies and answers are JSON in UTF-8. Names are camel case. A time is RFC 3339 in UTC. A pickup date and a due date are `YYYY-MM-DD` in the time zone Asia/Jakarta. The id of a ticket is its number and the id of a unit is its tag. Every other id is a UUID.

    Every answer carries `Cache-Control: no-store` and an `X-Request-Id` header. A client may send its own `X-Request-Id`.

    A list answers `{ "items": [...], "total": 120, "nextCursor": "..." }`. The query takes `limit` (default 50, most 100) and `cursor`. The field `total` is the number of all matches of the query and not only the items of the page. The field `nextCursor` is absent on the last page.

    A session is a cookie. Every POST, PATCH and DELETE also needs the CSRF header, except the three routes that start a session or look a ticket up. Those three rely on the `Origin` check and on their rate limits.

    Every error has the same body, and the field `code` is stable. A request over a rate limit answers 429 with the header `Retry-After`.
  license:
    name: GPL-3.0-only
    identifier: GPL-3.0-only
  contact:
    name: LabMGM
    url: https://github.com/MGM-Laboratory/mgm-inventaris-portal-backend
servers:
  - url: https://portal.example.org
    description: The public hostname of a deployment. The web app and the API share it.
tags:
  - name: Health
    description: Routes on the internal port for the proxy and for a monitor. They are not under `/api`.
  - name: Config
    description: The public settings of the portal.
  - name: Session
    description: Sign in, read and end a session.
  - name: Catalog
    description: The categories, the models with their quantities and the public page of a unit.
  - name: Tickets
    description: The routes of a borrower for the tickets of the session.
  - name: Admin tickets
    description: The routes of an admin for the queue and for the steps of a loan.
  - name: Admin assets
    description: The routes of an admin for categories, models and units.
  - name: Admin account
    description: The dashboard and the own account of an admin.
security:
  - sessionCookie: []
paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Say that the process runs
      description: It answers 200 while the process runs, and it does not read the database. The proxy and the rolling update call it on the internal port.
      security: []
      servers:
        - url: http://{address}
          description: The internal address of one copy of the service. It is not under `/api` and the proxy does not route it. The address is a placeholder until the service sets it.
          variables:
            address:
              default: 127.0.0.1:8081
      responses:
        "200":
          description: The process runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
        "4XX":
          $ref: "#/components/responses/ClientError"
  /readyz:
    get:
      tags: [Health]
      operationId: getReady
      summary: Say that the service can do its work
      description: It answers 200 when the database answers and 503 when it does not.
      security: []
      servers:
        - url: http://{address}
          description: The internal address of one copy of the service. It is not under `/api` and the proxy does not route it. The address is a placeholder until the service sets it.
          variables:
            address:
              default: 127.0.0.1:8081
      responses:
        "200":
          description: The database answers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ready
        "503":
          description: The database does not answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: unavailable
        "4XX":
          $ref: "#/components/responses/ClientError"

  /api/config:
    get:
      tags: [Config]
      operationId: getConfig
      summary: Read the public settings
      description: >-
        Anyone can read it.
        It holds the limits of the lab and the public address that the QR code uses.
        The QR address of a unit is `publicBaseUrl` plus `/aset/` plus the tag, for example `https://portal.example.org/aset/MGM-VRQ-001`.
      security: []
      responses:
        "200":
          description: The public settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
              example:
                publicBaseUrl: https://portal.example.org
                limits:
                  maxItemsPerRequest: 10
                  minDurationDays: 1
                  maxDurationDays: 30
                  maxOpenTickets: 3
        "4XX":
          $ref: "#/components/responses/ClientError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/session/guest:
    post:
      tags: [Session]
      operationId: startGuestSession
      summary: Start a guest session
      description: >-
        The guest sends the name, the NIM or NIP and an email of Universitas Brawijaya.
        The service makes a new session and ends the one that came with the request.
        The route needs no session and no CSRF token.
        It answers with the CSRF token in the body and sets the session cookie.
        A limit of the number of guest sign ins for one IP address applies.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestSignInRequest"
            example:
              name: Example Borrower
              nimNip: "000000000000000"
              email: example@student.ub.ac.id
      responses:
        "201":
          description: The session exists.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
              examples:
                guest:
                  $ref: "#/components/examples/SessionGuest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/session:
    get:
      tags: [Session]
      operationId: getSession
      summary: Read the session and the CSRF token
      description: Any session can call it, also a setup session of an admin. A client calls it again to read the CSRF token after `csrf_failed`.
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
              examples:
                guest:
                  $ref: "#/components/examples/SessionGuest"
                admin:
                  $ref: "#/components/examples/SessionAdmin"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      tags: [Session]
      operationId: endSession
      summary: End the session
      description: Any session can call it, also a setup session of an admin. The service deletes the session and clears the cookie.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: The session ended.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/admin/session:
    post:
      tags: [Session]
      operationId: signInAdmin
      summary: Sign in as an admin
      description: >-
        The body holds the email, the password and either a TOTP code or a recovery code.
        The route needs no session and no CSRF token.
        The service makes a new session and ends the one that came with the request.
        An admin who has no TOTP yet, or whose initial password expired, gets a session of the kind `admin_setup`.
        The use of a recovery code ends the other sessions of that admin.
        After too many failed sign ins for one email from one IP address, that pair answers 429 for a while.
        A limit of failed sign ins for one IP address also applies.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSignInRequest"
            example:
              email: admin@example.org
              password: example-password-only
              totpCode: "000000"
      responses:
        "201":
          description: The session exists.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
              examples:
                admin:
                  $ref: "#/components/examples/SessionAdmin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/categories:
    get:
      tags: [Catalog]
      operationId: listCategories
      summary: List the categories
      description: A guest session or an admin session can call it.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of categories, ordered by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryPage"
              example:
                items:
                  - id: 00000000-0000-4000-8000-000000000001
                    name: Example category
                    tone: blue
                total: 1
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/catalog:
    get:
      tags: [Catalog]
      operationId: listCatalog
      summary: List the models with their quantities
      description: >-
        A guest session or an admin session can call it.
        Each model shows the total, the held and the available quantity.
        A retired model is not listed.
        The filter `available` narrows the list to the models that can be requested now.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          required: false
          description: Only the models whose name or description contains this text. The match ignores letter case. The text has at least 2 characters.
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: categoryId
          in: query
          required: false
          description: Only the models of this category.
          schema:
            type: string
            format: uuid
        - name: available
          in: query
          required: false
          description: True returns only the models whose available quantity is above 0. False or no value lists every model.
          schema:
            type: boolean
      responses:
        "200":
          description: A page of models, ordered by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPage"
              examples:
                page:
                  $ref: "#/components/examples/CatalogPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/assets/{tag}:
    get:
      tags: [Catalog]
      operationId: getAsset
      summary: Read the page of one unit
      description: >-
        Anyone can read it, because the QR label of a unit leads here.
        A request without an admin session gets only the tag, the status and the model.
        The model has its category and its available quantity, so the page can show whether the item can be requested now.
        The serial number, the condition, the place and the related ticket are in the answer only for an admin session.
      security:
        - {}
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/UnitTag"
      responses:
        "200":
          description: The unit. An admin session gets the schema `AdminAsset` and every other request gets `PublicAsset`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AdminAsset"
                  - $ref: "#/components/schemas/PublicAsset"
              examples:
                public:
                  $ref: "#/components/examples/PublicAsset"
                admin:
                  $ref: "#/components/examples/AdminAsset"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/tickets:
    post:
      tags: [Tickets]
      operationId: createTicket
      summary: Create a ticket
      description: >-
        A guest session with an identity can call it.
        A session with no identity answers 403 with the code `identity_required` until the guest form is sent.
        Such a session has no name, no NIM or NIP and no email, and a lookup can make one.
        A session with the wrong role answers 403 with the code `forbidden`.
        The service checks the limits, makes the number and the rows, and starts the ticket as `diajukan`.
        A field that fails a rule answers 422 with the code `validation_failed`, and `details` names each field with one of the codes below.
        The code `too_many` means that a quantity is above the available quantity of the model at that moment. The field is `items[i].qty`, where `i` is the position of the item.
        The code `model_retired` means that the model is retired. The field is `items[i].modelId`.
        The code `too_many_items` means that the quantities added together are above `maxItemsPerRequest`. The field is `items`.
        The code `too_many_open_tickets` means that the email or the NIM or NIP already has the most open tickets that the lab allows. The field is `requester`.
        The codes `not_ub_email`, `required`, `invalid_format`, `out_of_range` and `too_long` can also come back for the other fields.
        The check of the quantity runs when the ticket is created, and an approval later can still answer 409 with the code `stock_changed`.
        A limit of the number of new tickets for one IP address applies, and every request counts.
        A request with an `Idempotency-Key` that the session already used returns the first answer and ignores the new body.
        A request that fills the hidden field `website` gets a normal looking answer and creates nothing.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketCreate"
            example:
              items:
                - modelId: 00000000-0000-4000-8000-000000000002
                  qty: 2
              purpose: Example loan for a lab exercise.
              pickupDate: "2026-11-20"
              durationDays: 7
      responses:
        "201":
          description: The ticket exists in the status `diajukan`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
              examples:
                ticket:
                  $ref: "#/components/examples/Ticket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/IdentityRequired"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      tags: [Tickets]
      operationId: listTickets
      summary: List the tickets of the session
      description: A guest session can call it. The list holds the tickets that the session created or found with a lookup, newest first.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of tickets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketPage"
              examples:
                page:
                  $ref: "#/components/examples/TicketPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/tickets/lookup:
    post:
      tags: [Tickets]
      operationId: lookupTicket
      summary: Find a ticket by its number and email
      description: >-
        Anyone can call it, with or without a session, and it needs no CSRF token.
        A match returns the ticket and adds it to the session.
        With no session, the service starts a guest session without an identity and sets its cookie.
        A guest session keeps its identity and only gains the ticket.
        An admin session changes in no way.
        A failed lookup makes no session and answers 404 with the code `ticket_not_found`, which is the same answer for a wrong number and a wrong email.
        Failed lookups count for one IP address, and also for the part of the number before its last four characters together with the email.
      security:
        - {}
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LookupRequest"
            example:
              number: MGM-2611-0001-K7QX
              email: example@student.ub.ac.id
      responses:
        "200":
          description: The ticket and the CSRF token of the session.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupResult"
              examples:
                found:
                  $ref: "#/components/examples/LookupResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "404":
          $ref: "#/components/responses/TicketNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/tickets/{number}:
    get:
      tags: [Tickets]
      operationId: getTicket
      summary: Read one ticket of the session
      description: A guest session can call it. A ticket that the session did not create or find answers 404 with the code `not_found`.
      parameters:
        - $ref: "#/components/parameters/TicketNumber"
      responses:
        "200":
          description: The ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
              examples:
                ticket:
                  $ref: "#/components/examples/Ticket"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/tickets/{number}/cancel:
    post:
      tags: [Tickets]
      operationId: cancelTicket
      summary: Cancel a ticket
      description: >-
        A guest session can cancel a ticket of the session in the status `diajukan`.
        A second cancel of a ticket that is already `dibatalkan` answers 200 with the ticket and changes nothing.
        Any other status answers 409 with the code `status_conflict`.
        The request has no body.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/TicketNumber"
      responses:
        "200":
          description: The ticket in the status `dibatalkan`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
              examples:
                ticket:
                  $ref: "#/components/examples/Ticket"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/admin/tickets:
    get:
      tags: [Admin tickets]
      operationId: listAdminTickets
      summary: List the queue of tickets
      description: >-
        An admin session can call it.
        The list holds the tickets of every borrower, newest first.
        It can be filtered by status, by pickup date and by due date.
        Every filter narrows the list, so a ticket has to pass all the filters that the request names.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          required: false
          description: Only the tickets whose number, requester name or NIM or NIP contains this text. The match ignores letter case. The text has at least 2 characters.
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: status
          in: query
          required: false
          style: form
          explode: false
          description: >-
            Only the tickets with one of these effective statuses, as a list separated by commas, for example `status=disetujui,siap_diambil`.
            The filter uses the effective status, so `dipinjam` lists only the tickets that are not late and `terlambat` lists the late ones.
            The value `siap_diambil` is the dashboard key `siapDiambil`.
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              $ref: "#/components/schemas/EffectiveTicketStatus"
          example: [disetujui, siap_diambil]
        - name: pickupFrom
          in: query
          required: false
          description: Only the tickets with a pickup date on this date or later. The date is in Asia/Jakarta.
          schema:
            type: string
            format: date
        - name: pickupTo
          in: query
          required: false
          description: Only the tickets with a pickup date on this date or earlier. The date is in Asia/Jakarta.
          schema:
            type: string
            format: date
        - name: dueFrom
          in: query
          required: false
          description: Only the tickets with a due date on this date or later. The date is in Asia/Jakarta.
          schema:
            type: string
            format: date
        - name: dueTo
          in: query
          required: false
          description: Only the tickets with a due date on this date or earlier. The date is in Asia/Jakarta.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: A page of tickets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketPage"
              examples:
                page:
                  $ref: "#/components/examples/TicketPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/admin/tickets/{number}:
    get:
      tags: [Admin tickets]
      operationId: getAdminTicket
      summary: Read any ticket
      description: An admin session can call it. The answer adds the units that the ticket holds.
      parameters:
        - $ref: "#/components/parameters/TicketNumber"
      responses:
        "200":
          description: The ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTicket"
              examples:
                ticket:
                  $ref: "#/components/examples/AdminTicket"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/admin/tickets/{number}/decision:
    post:
      tags: [Admin tickets]
      operationId: decideTicket
      summary: Approve or reject a ticket
      description: >-
        An admin session can call it for a ticket in the status `diajukan`.
        An approval moves the ticket to `disetujui` and a rejection moves it to `ditolak`.
        The body carries the version that the admin read.
        An approval that holds nothing, because every approved quantity is 0, answers 422 with the code `validation_failed`.
        A `durationDays` above the `maxDurationDays` of `GET /api/config` answers 422 with the code `validation_failed` and the detail code `out_of_range`.
        A stale version answers 409 with the code `version_conflict` and another status answers 409 with the code `status_conflict`.
        Too little available stock for an approved quantity answers 409 with the code `stock_changed`.
        The note of an approval or a rejection is stored in `Ticket.decisionNote`, which keeps the latest note, and also in the history entry of the change.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/TicketNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
            examples:
              approve:
                summary: An approval
                value:
                  version: 1
                  decision: approve
                  items:
                    - modelId: 00000000-0000-4000-8000-000000000002
                      approvedQty: 2
                  durationDays: 7
              reject:
                summary: A rejection
                value:
                  version: 1
                  decision: reject
                  note: The items are not free on those days.
      responses:
        "200":
          description: The ticket after the decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTicket"
              examples:
                ticket:
                  $ref: "#/components/examples/AdminTicket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
