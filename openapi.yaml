  /api/admin/dashboard:
    get:
      tags: [Admin account]
      operationId: getDashboard
      summary: Read the counts for the dashboard
      description: >-
        An admin session can call it.
        The counts of `tickets` are for the open tickets of each effective status, so `dipinjam` does not count late tickets and `terlambat` counts them.
        The key `siapDiambil` counts the status `siap_diambil`.
        The object `byStatus` counts the tickets of every effective status, the closed ones included.
        The list `byCategory` counts the units of each category.
