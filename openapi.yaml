      summary: Take the units back
      description: >-
        An admin session can call it for a ticket in the status `dipinjam`, also when it is late.
        The body names every unit that the ticket holds with an outcome.
        The return is all or nothing and runs in one transaction.
        The ticket moves to `dikembalikan`, and a unit with the outcome `maintenance` or `lost` changes its lifecycle.
        A stale version answers 409 with the code `version_conflict` and another status answers 409 with the code `status_conflict`.
