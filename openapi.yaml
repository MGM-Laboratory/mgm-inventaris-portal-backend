        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          required: false
          description: Only the models whose name contains this text. The match ignores letter case. The text has at least 2 characters.
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: categoryId
          in: query
          required: false
          description: Only the models of this category.
          schema:
            type: string
            format: uuid
        - name: includeRetired
          in: query
          required: false
          description: True lists the retired models too.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: A page of models, ordered by name.
          content:
