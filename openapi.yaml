  /api/admin/tickets/{number}/handover:
    post:
      tags: [Admin tickets]
      operationId: handOverTicket
      summary: Hand the units over
      description: >-
        An admin session can call it for a ticket in the status `siap_diambil`.
        The admin scans the QR label of each unit and posts the tags, exactly the approved quantity for each model.
        The ticket moves to `dipinjam`.
        A stale version answers 409 with the code `version_conflict` and another status answers 409 with the code `status_conflict`.
        A unit that is not active, not of the right model or already in an open ticket answers 409 with the code `unit_unavailable`.
        A stock that fell below the approved quantity since the approval, for example after a unit was lost, answers 409 with the code `stock_changed`.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/TicketNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandoverRequest"
            example:
              version: 3
              tags:
