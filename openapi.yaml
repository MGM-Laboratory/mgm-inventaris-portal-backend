            schema:
              $ref: "#/components/schemas/ReturnRequest"
            example:
              version: 4
              units:
                - tag: MGM-VRQ-001
                  outcome: ok
                - tag: MGM-VRQ-002
                  outcome: lost
                  note: The unit did not come back.
      responses:
        "200":
          description: The ticket in the status `dikembalikan`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTicket"
              examples:
                ticket:
                  $ref: "#/components/examples/AdminTicket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
