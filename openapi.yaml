  /api/admin/tickets/{number}/handover:
    post:
      tags: [Admin tickets]
      operationId: handOverTicket
      summary: Hand the units over
      description: >-
        An admin session can call it for a ticket in the status `siap_diambil`.
        The admin scans the QR label of each unit and posts the tags, exactly the approved quantity for each model.
        The ticket moves to `dipinjam`.
        A stale version answers 409 with the code `version_conflict` and another status answers 409 with the code `status_conflict`.
        A unit that is not active, not of the right model or already in an open ticket answers 409 with the code `unit_unavailable`.
        A stock that fell below the approved quantity since the approval, for example after a unit was lost, answers 409 with the code `stock_changed`.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/TicketNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandoverRequest"
            example:
              version: 3
              tags:
                - MGM-VRQ-001
                - MGM-VRQ-002
      responses:
        "200":
          description: The ticket in the status `dipinjam`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTicket"
              examples:
                ticket:
                  $ref: "#/components/examples/AdminTicket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/admin/tickets/{number}/return:
    post:
      tags: [Admin tickets]
      operationId: returnTicket
      summary: Take the units back
      description: >-
        An admin session can call it for a ticket in the status `dipinjam`, also when it is late.
        The body names every unit that the ticket holds with an outcome.
        The return is all or nothing and runs in one transaction.
        The ticket moves to `dikembalikan`, and a unit with the outcome `maintenance` or `lost` changes its lifecycle.
        A stale version answers 409 with the code `version_conflict` and another status answers 409 with the code `status_conflict`.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/TicketNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnRequest"
            example:
              version: 4
              units:
                - tag: MGM-VRQ-001
                  outcome: ok
                - tag: MGM-VRQ-002
                  outcome: lost
                  note: The unit did not come back.
      responses:
        "200":
          description: The ticket in the status `dikembalikan`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTicket"
              examples:
                ticket:
                  $ref: "#/components/examples/AdminTicket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/admin/tickets/{number}/cancel:
    post:
      tags: [Admin tickets]
      operationId: cancelAdminTicket
      summary: Cancel an approved ticket with a note
      description: >-
        An admin session can call it for a ticket in the status `disetujui` or `siap_diambil`.
        The ticket moves to `dibatalkan` and releases its hold.
        A ticket that nobody collects is closed this way.
        A stale version answers 409 with the code `version_conflict` and another status answers 409 with the code `status_conflict`.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/TicketNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCancelRequest"
            example:
              version: 3
              note: Nobody collected the items.
      responses:
        "200":
          description: The ticket in the status `dibatalkan`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTicket"
              examples:
                ticket:
                  $ref: "#/components/examples/AdminTicket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
