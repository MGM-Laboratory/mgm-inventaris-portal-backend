        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCancelRequest"
            example:
              version: 3
              note: Nobody collected the items.
      responses:
        "200":
          description: The ticket in the status `dibatalkan`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTicket"
              examples:
                ticket:
                  $ref: "#/components/examples/AdminTicket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
