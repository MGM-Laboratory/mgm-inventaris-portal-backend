        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [Admin assets]
      operationId: createModel
      summary: Add a model
      description: >-
        An admin session can call it.
        The body names the category with either `categoryId` or `newCategory`, and never both.
        A `newCategory` is created in the same transaction as the model.
        A `newCategory` whose name already exists, ignoring letter case, reuses the existing category and does not fail.
        A name or a prefix that another model uses answers 409 with the code `duplicate`, and the uniqueness of names and prefixes ignores letter case.
        The error carries `details` with the field `name` or `prefix` and the code `duplicate`.
        A new model has no units, so its quantities are 0.
        A request with an `Idempotency-Key` that the session already used returns the first answer and ignores the new body.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelInput"
            examples:
              existingCategory:
                summary: A model in an existing category
                value:
                  name: Example headset
                  categoryId: 00000000-0000-4000-8000-000000000001
                  description: A headset for an example prototype.
                  prefix: VRQ
              newCategory:
                summary: A model with a new category
                value:
                  name: Example headset
                  newCategory:
                    name: Example category
                    tone: blue
                  description: A headset for an example prototype.
                  prefix: VRQ
      responses:
        "201":
          description: The model exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
              examples:
                model:
                  $ref: "#/components/examples/Model"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
