        A name that another model uses answers 409 with the code `duplicate`, and the uniqueness of names ignores letter case.
        The error carries `details` with the field `name` and the code `duplicate`.
        Retiring a model that an open ticket asks for answers 409 with the code `status_conflict`.
        The route has no version, so two admins who change the same model do not conflict and the last write wins.
